name: Release container
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (vMAJOR.MINOR.PATCH; must match pyproject.toml)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-container
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.13'
      - name: Validate stable release version
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected vMAJOR.MINOR.PATCH'
          with open('pyproject.toml', 'rb') as handle:
              assert tomllib.load(handle)['project']['version'] == tag[1:]
          PY
      - name: Create release tag at the tested commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "Release tag already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/karoc123/nebula-to-jellyfin:${{ env.RELEASE_TAG }}
            ghcr.io/karoc123/nebula-to-jellyfin:latest
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
