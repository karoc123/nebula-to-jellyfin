[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nebula-to-jellyfin"
version = "0.2.0"
description = "A persistent Nebula downloader with a local Jellyfin library"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "yt-dlp>=2026.8.19",
  "packaging>=24",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.13", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"app/main.py" = ["B008"]
