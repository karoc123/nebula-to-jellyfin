<form class="panel import" id="import" method="post" action="/add" data-form hidden>
<div><label for="urls">Nebula URLs, one per line</label>
<textarea id="urls" name="urls" rows="3" required placeholder="https://nebula.tv/…"></textarea></div>
<div class="row">
<fieldset class="seg" id="import-kind" aria-label="Import type">
<label><input type="radio" name="import-kind" value="video" {% if import_mode != 'future' %}checked{% endif %}>Videos</label>
<label><input type="radio" name="import-kind" value="channel" {% if import_mode == 'future' %}checked{% endif %}>Channels</label>
</fieldset>
<select name="mode" id="import-mode" aria-label="Channel selection"><option value="video" {% if import_mode != 'future' %}selected{% endif %}>Individual videos</option><option value="future" {% if import_mode == 'future' %}selected{% endif %}>Future uploads only</option><option value="latest">Latest videos</option><option value="all">All videos</option></select>
<label class="check" id="import-latest">Count <input name="latest" type="number" min="1" max="10000" value="10" aria-label="Latest count"></label>
<label class="check" id="import-subscription"><input name="subscribed" type="checkbox" value="true"> Subscribe</label>
<span class="grow"></span>
<button type="button" class="quiet" data-import-close>Cancel</button>
<button type="submit" class="primary">Queue import</button>
</div>
<p class="meta" id="import-hint">Future uploads only saves the current catalog as a baseline and downloads new uploads found later. Saved videos can be selected from the channel catalog.</p>
<p class="form-feedback" role="status"></p>
</form>
