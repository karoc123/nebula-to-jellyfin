<details class="card import" {% if import_open %}open{% endif %}>
<summary>Add downloads</summary>
<form method="post" action="/add" data-form>
<label for="urls">Nebula URLs, one per line</label>
<textarea id="urls" name="urls" rows="3" required placeholder="https://nebula.tv/…"></textarea>
<div class="field-grid">
<label class="import-kind">Import type <select id="import-kind"><option value="video" {% if import_mode != 'future' %}selected{% endif %}>Videos</option><option value="channel" {% if import_mode == 'future' %}selected{% endif %}>Channels</option></select></label>
<label class="import-channel-options" id="import-mode-label">Channel selection <select name="mode" id="import-mode"><option value="video" {% if import_mode != 'future' %}selected{% endif %}>Individual videos</option><option value="future" {% if import_mode == 'future' %}selected{% endif %}>Future only</option><option value="latest">Latest videos</option><option value="all">All videos</option></select></label>
<label id="import-latest">Latest count <input name="latest" type="number" min="1" max="10000" value="10"></label>
<label class="inline import-channel-options" id="import-subscription"><input name="subscribed" type="checkbox" value="true"> Subscribe to channel</label>
</div>
<p class="hint">For channels, future only saves the current catalog as a baseline and downloads new uploads discovered later. You can select saved videos from the catalog.</p>
<button>Queue import</button><p class="form-feedback" role="status"></p>
</form></details>
