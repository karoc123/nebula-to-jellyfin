{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>Downloads</h1>
<button type="button" class="secondary" id="pause-button" data-queue="pause" {% if paused %}hidden{% endif %}>Pause downloads</button></div>
{% include "_import.html" %}
<section class="card" id="downloads">
<div class="toolbar">
<div class="chips" role="group" aria-label="Status">
{% for value, label in [("", "All"), ("active", "Active"), ("done", "Done"), ("error", "Failed")] %}
<button type="button" class="chip" data-status="{{ value }}">{{ label }} <span class="count" data-count="{{ value }}"></span></button>
{% endfor %}
</div>
<select id="channel-filter" aria-label="Channel"><option value="">All channels</option>
{% for channel in channels %}<option value="{{ channel.id }}">{{ channel.name }}</option>{% endfor %}</select>
<input type="search" id="search" placeholder="Search titles" aria-label="Search titles" maxlength="200">
</div>
<div class="toolbar bulk">
<span class="hint" id="bulk-scope">Applies to all matching downloads, not only this page.</span>
<button type="button" class="secondary" data-bulk="retry-errors">Retry failed</button>
<button type="button" class="secondary" data-bulk="remove-errors">Remove failed</button>
<button type="button" class="secondary" data-bulk="remove-done">Remove done</button>
</div>
<div class="table-scroll"><table class="stack"><thead><tr><th>Status</th><th>Video</th><th>Updated</th><th></th></tr></thead><tbody id="videos"></tbody></table></div>
<div class="pager"><button type="button" class="secondary" id="previous">Previous</button><span id="page" class="hint"></span><button type="button" class="secondary" id="next">Next</button></div>
</section>
{% endblock %}
